name: Desktop checks and builds
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - run: npm ci
      - run: npm run check:source
      - run: npm run test:source-check
      - run: npm run check:security
      - run: npm run check:api
      - run: npm run format:check
      - run: npm run test:ui-state
      - run: npm audit --audit-level=high
      - run: npm --prefix reverse-worker audit --audit-level=high
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path reverse-worker/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path reverse-worker/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: go vet ./...
        working-directory: agent
      - run: go test -race ./...
        working-directory: agent
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: gaga-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
  isolated-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull=false -t gaga-analysis:0.9.0 reverse-worker
      - run: python3 scripts/test-isolated.py /tmp/gaga-isolated-checks
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-protocol-results
          path: /tmp/gaga-isolated-checks/*.json
  page-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix monitor-browser audit --omit=dev --audit-level=high
      - run: npm run build:monitor-browser
      - run: npm run test:browser-capture -- /tmp/gaga-browser-checks.json
      - uses: actions/upload-artifact@v4
        with:
          name: page-capture-results
          path: /tmp/gaga-browser-checks.json
