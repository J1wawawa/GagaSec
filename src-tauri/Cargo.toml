[package]
name = "gaga-security-assistant"
version = "0.10.1"
description = "Local blue-team investigation and evidence desktop application"
authors = ["J4team"]
edition = "2021"
license-file = "../LICENSE.txt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
regex = "1"
flate2 = "1"
percent-encoding = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
ipnet = "2"
scraper = "0.24"
sha1 = "0.10"
md-5 = "0.10"
aws-lc-rs = "1.18.2"
rand = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
fs2 = "0.4"
tokio = { version = "1", features = ["time", "sync", "net"] }
lopdf = { version = "0.42.0", default-features = false }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
goblin = "0.9"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8

[profile.dev]
debug = 0
incremental = false
